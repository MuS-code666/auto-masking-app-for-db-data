[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maskapp"
version = "0.0.1"
description = "業務データ（Excel・CSV）の名称・コードをローカルで置換するアプリ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyahocorasick>=2.1",  # 残存検査の多語句検索（BSD-3-Clause）
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",  # 合成データの xlsx 作成用（製品の出力処理には使わない）
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
